
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B18"/>
      <stop offset="55%" stop-color="#190D32"/>
      <stop offset="100%" stop-color="#061820"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#B44CFF"/>
      <stop offset="100%" stop-color="#FF3158"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B44CFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6575A8" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" rx="20" fill="url(#background)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

  <!-- Header -->
  <path d="M0 72H1200" stroke="#6C78A8" stroke-opacity="0.5"/>

  <circle cx="30" cy="32" r="6" fill="#FF3158"/>
  <circle cx="50" cy="32" r="6" fill="#FFB547"/>
  <circle cx="70" cy="32" r="6" fill="#00F5A0"/>

  <text x="95" y="39" fill="#EAF1FF" font-size="19"
        font-family="monospace" letter-spacing="3">
    SENTINEL-X
  </text>

  <text x="1160" y="39" text-anchor="end"
        fill="#00F5FF" font-size="13" font-family="monospace">
    CYBER INTELLIGENCE SYSTEM
  </text>

  <!-- Connection network -->
  <g fill="none" stroke-width="2">
    <path d="M230 180 L390 220 L490 260" stroke="#00E5FF" stroke-opacity="0.8"/>
    <path d="M230 375 L390 340 L490 300" stroke="#B44CFF" stroke-opacity="0.8"/>
    <path d="M970 180 L810 220 L710 260" stroke="#FF3158" stroke-opacity="0.8"/>
    <path d="M970 375 L810 340 L710 300" stroke="#FFB547" stroke-opacity="0.8"/>
    <path d="M600 130V175" stroke="#00E5FF" stroke-dasharray="5 6"/>
    <path d="M600 365V420" stroke="#B44CFF" stroke-dasharray="5 6"/>
  </g>

  <!-- Animated evidence packets -->
  <circle r="6" fill="#00F5FF">
    <animateMotion dur="3s" repeatCount="indefinite"
      path="M230 180 L390 220 L490 260"/>
  </circle>

  <circle r="6" fill="#B44CFF">
    <animateMotion dur="3.6s" repeatCount="indefinite"
      path="M230 375 L390 340 L490 300"/>
  </circle>

  <circle r="6" fill="#FF3158">
    <animateMotion dur="3.2s" repeatCount="indefinite"
      path="M970 180 L810 220 L710 260"/>
  </circle>

  <circle r="6" fill="#FFB547">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M970 375 L810 340 L710 300"/>
  </circle>

  <!-- Left telemetry panel -->
  <rect x="55" y="140" width="175" height="82" rx="10"
        fill="#0B1D2B" stroke="#00E5FF" stroke-width="2"/>

  <text x="142" y="172" text-anchor="middle"
        fill="#00E5FF" font-size="13" font-family="monospace">
    01 / TELEMETRY
  </text>
  <text x="142" y="197" text-anchor="middle"
        fill="#FFFFFF" font-size="16" font-family="monospace">
    SYSTEM LOGS
  </text>

  <!-- Left identity panel -->
  <rect x="55" y="335" width="175" height="82" rx="10"
        fill="#1B1030" stroke="#B44CFF" stroke-width="2"/>

  <text x="142" y="367" text-anchor="middle"
        fill="#C78BFF" font-size="13" font-family="monospace">
    02 / IDENTITY
  </text>
  <text x="142" y="392" text-anchor="middle"
        fill="#FFFFFF" font-size="16" font-family="monospace">
    AUTH EVENTS
  </text>

  <!-- Right network panel -->
  <rect x="970" y="140" width="175" height="82" rx="10"
        fill="#280F21" stroke="#FF3158" stroke-width="2"/>

  <text x="1057" y="172" text-anchor="middle"
        fill="#FF6681" font-size="13" font-family="monospace">
    03 / NETWORK
  </text>
  <text x="1057" y="197" text-anchor="middle"
        fill="#FFFFFF" font-size="16" font-family="monospace">
    DNS / FLOWS
  </text>

  <!-- Right endpoint panel -->
  <rect x="970" y="335" width="175" height="82" rx="10"
        fill="#241A0D" stroke="#FFB547" stroke-width="2"/>

  <text x="1057" y="367" text-anchor="middle"
        fill="#FFB547" font-size="13" font-family="monospace">
    04 / ENDPOINT
  </text>
  <text x="1057" y="392" text-anchor="middle"
        fill="#FFFFFF" font-size="16" font-family="monospace">
    PROCESS EVENTS
  </text>

  <!-- Central intelligence core -->
  <circle cx="600" cy="280" r="115"
          fill="#0A1023" stroke="url(#neon)" stroke-width="3"/>

  <circle cx="600" cy="280" r="94"
          fill="none" stroke="#00E5FF"
          stroke-width="2" stroke-dasharray="5 10">
    <animateTransform attributeName="transform"
      type="rotate" from="0 600 280" to="360 600 280"
      dur="16s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="280" r="72"
          fill="none" stroke="#B44CFF" stroke-width="1.5">
    <animate attributeName="r" values="65;75;65"
      dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;1;0.3"
      dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="253" text-anchor="middle"
        fill="#D49BFF" font-size="17" letter-spacing="4"
        font-family="monospace">
    SENTINEL
  </text>

  <text x="600" y="301" text-anchor="middle"
        fill="#FFFFFF" font-size="43" font-weight="bold"
        font-family="monospace">
    X
  </text>

  <text x="600" y="327" text-anchor="middle"
        fill="#00F5FF" font-size="12" letter-spacing="2"
        font-family="monospace">
    AI / ANALYSIS CORE
  </text>

  <!-- Moving scanner beam -->
  <rect x="475" y="215" width="250" height="4" fill="url(#beam)">
    <animate attributeName="y" values="205;350;205"
      dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Investigation pipeline -->
  <path d="M60 450H1140" stroke="#6575A8" stroke-opacity="0.6"/>

  <g text-anchor="middle" font-family="monospace">
    <text x="170" y="480" fill="#00E5FF" font-size="15">INGEST</text>
    <text x="455" y="480" fill="#B44CFF" font-size="15">CORRELATE</text>
    <text x="745" y="480" fill="#FFB547" font-size="15">RECONSTRUCT</text>
    <text x="1030" y="480" fill="#FF6681" font-size="15">VERIFY</text>

    <text x="170" y="503" fill="#A5B1CF" font-size="11">RAW EVENTS</text>
    <text x="455" y="503" fill="#A5B1CF" font-size="11">TEMPORAL GRAPH</text>
    <text x="745" y="503" fill="#A5B1CF" font-size="11">INCIDENT TIMELINE</text>
    <text x="1030" y="503" fill="#A5B1CF" font-size="11">LINKED EVIDENCE</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="535" width="1200" height="25" fill="#070A14"/>

  <text x="24" y="552" fill="#8290B2"
        font-size="11" font-family="monospace">
    EVIDENCE-GROUNDED AI // DIGITAL FORENSICS // HUMAN OVERSIGHT
  </text>

  <text x="1175" y="552" text-anchor="end"
        fill="#00F5FF" font-size="11" font-family="monospace">
    SX-001
  </text>

</svg>
